spring.application.name=enrollment-service
server.port=8083

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Enrollment Service Database (Database-per-Service)
spring.datasource.url=jdbc:h2:mem:enrollmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Retry configuration
resilience4j.retry.instances.courseService.max-attempts=3
resilience4j.retry.instances.courseService.wait-duration=1s

# Retry only when Course Service is unavailable (connection failure, timeout, no instance, 5xx).
# CourseNotFoundException (404) is not listed, so a missing course is never retried.
resilience4j.retry.instances.courseService.retry-exceptions=com.learnsphere.enrollmentservice.exception.CourseServiceUnavailableException


# Circuit Breaker configuration
resilience4j.circuitbreaker.instances.courseService.sliding-window-size=5
resilience4j.circuitbreaker.instances.courseService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.courseService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.courseService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.courseService.permitted-number-of-calls-in-half-open-state=2

# Only technical Course Service failures affect the circuit breaker.
# A 404 (CourseNotFoundException) is not recorded as a failure.
resilience4j.circuitbreaker.instances.courseService.record-exceptions=com.learnsphere.enrollmentservice.exception.CourseServiceUnavailableException


# Expose selected Actuator endpoints
management.endpoints.web.exposure.include=health,metrics

# Show detailed health information
management.endpoint.health.show-details=always

# Enable Circuit Breaker health reporting
management.health.circuitbreakers.enabled=true

# Register the courseService Circuit Breaker with Actuator health
resilience4j.circuitbreaker.instances.courseService.register-health-indicator=true
