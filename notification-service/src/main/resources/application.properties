spring.application.name=notification-service
server.port=8084

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Notification Service Database (Database-per-Service): MongoDB
# Local: mongodb://localhost:27017/notificationdb
# Docker: overridden with SPRING_MONGODB_URI=mongodb://mongodb:27017/notificationdb
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/notificationdb}
spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/notificationdb}

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
