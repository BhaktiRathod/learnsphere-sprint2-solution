spring.application.name=resource-service
server.port=8085

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Resource Service Database (Database-per-Service): its own MongoDB database
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/resourcedb}
spring.mongodb.database=resourcedb

# Spring Cache with Caffeine
spring.cache.type=caffeine
spring.cache.cache-names=resources
# TTL: cached resources expire 60 seconds after they are written
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

# Show cache hit/miss behaviour in the logs
logging.level.org.springframework.cache.interceptor=TRACE
