services:

  # -------------------------
  # RabbitMQ
  # -------------------------
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # -------------------------
  # Eureka Discovery Server
  # -------------------------
  discovery-server:
    build:
      context: .
      target: discovery-server
    ports:
      - "8761:8761"


  # -------------------------
  # Course Service
  # -------------------------
  course-service:
    build:
      context: .
      target: course-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_started


  # -------------------------
  # Learner Service
  # -------------------------
  learner-service:
    build:
      context: .
      target: learner-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_started


  # -------------------------
  # Enrollment Service
  # -------------------------
  enrollment-service:
    build:
      context: .
      target: enrollment-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_started
      course-service:
        condition: service_started


  # -------------------------
  # Notification Service
  # -------------------------
  notification-service:
    build:
      context: .
      target: notification-service
    ports:
      - "8084:8084"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_started


  # -------------------------
  # API Gateway
  # -------------------------
  api-gateway:
    build:
      context: .
      target: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_started
      course-service:
        condition: service_started
      learner-service:
        condition: service_started
      enrollment-service:
        condition: service_started
