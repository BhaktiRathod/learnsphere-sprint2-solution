spring.application.name=api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Spring Cloud Gateway (WebFlux) routes
# Each route = id + discovery-based lb:// URI + Path predicate. No fixed hosts or ports.

# Course Service route
spring.cloud.gateway.server.webflux.routes[0].id=course-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://COURSE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/courses/**

# Learner Service route
spring.cloud.gateway.server.webflux.routes[1].id=learner-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://LEARNER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/learners/**

# Enrollment Service route
spring.cloud.gateway.server.webflux.routes[2].id=enrollment-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ENROLLMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/enrollments/**
