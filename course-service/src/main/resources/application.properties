spring.application.name=course-service
server.port=8081

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Course Service Database (Database-per-Service)
spring.datasource.url=jdbc:h2:mem:coursedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Distributed logging and tracing
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [${spring.application.name}] [correlationId=%X{correlationId:-}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] %logger{36} - %msg%n
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.enabled=false
